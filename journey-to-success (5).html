<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Journey to Success</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy: #13223D;
    --navy-deep: #0C182C;
    --blue: #2A5C8A;
    --blue-dark: #1F4568;
    --ink: #1C2430;
    --ink-soft: #59626F;
    --bg: #F5F7FA;
    --surface: #FFFFFF;
    --line: #DEE3EA;
    --line-strong: #C6CEDA;
    --teal: #0E7C72;
    --teal-bg: #E4F2F0;
    --amber: #92600B;
    --amber-bg: #FBF0DD;
    --plum: #5B3E8C;
    --plum-bg: #EFE9F7;
    --rose: #A13A3A;
    --rose-bg: #F7E6E6;
    --cyan: #0B6E8F;
    --cyan-bg: #DEEEF4;
    --champagne-light: #F6EAD2;
    --champagne: #E8D2A0;
    --champagne-deep: #C9A96E;
    --champagne-text: #6B5427;
    --radius: 8px;
    --shadow-sm: 0 1px 2px rgba(19,34,61,0.06);
    --shadow-md: 0 4px 16px rgba(19,34,61,0.08);
    --container: 1080px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    font-size:15px;
  }
  h1,h2,h3{
    font-family:'Source Serif 4',Georgia,serif;
    font-weight:600;
    letter-spacing:-0.012em;
    margin:0;
    color:var(--navy);
  }
  .eyebrow{
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--blue-dark);
    font-weight:600;
  }
  button{font-family:inherit;cursor:pointer;}
  a{color:inherit;}
  #app{min-height:100vh;display:flex;flex-direction:column;}

  /* ---------- Top bar ---------- */
  .topbar{
    background:var(--navy-deep); color:#DCE4EF; font-size:12.5px;
    padding:7px 0;
  }
  .topbar-inner{max-width:var(--container);margin:0 auto;padding:0 32px;display:flex;justify-content:space-between;}
  .topbar span{color:#8FA3C0;}

  /* ---------- Header / Nav ---------- */
  .app-header{
    background:var(--surface);border-bottom:1px solid var(--line);
    position:sticky;top:0;z-index:10;
  }
  .header-inner{
    max-width:var(--container);margin:0 auto;padding:16px 32px;
    display:flex;align-items:center;justify-content:space-between;gap:24px;
  }
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-mark{
    width:36px;height:36px;border-radius:6px;background:var(--navy);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    color:#fff;font-family:'Source Serif 4',serif;font-weight:700;font-size:15px;
  }
  .brand-text{display:flex;flex-direction:column;line-height:1.15;}
  .brand-name{font-family:'Source Serif 4',serif;font-weight:600;font-size:16.5px;color:var(--navy);}
  .brand-sub{font-size:11px;color:var(--ink-soft);letter-spacing:0.03em;}

  .steps-nav{display:flex;align-items:center;gap:0;}
  .header-right-group{display:flex;align-items:center;gap:18px;}
  .lang-select{
    border:1.5px solid var(--line-strong);border-radius:6px;padding:7px 10px;
    font-size:12.5px;font-weight:600;color:var(--navy);background:#fff;cursor:pointer;
  }
  .lang-select:focus-visible{outline:3px solid var(--blue);outline-offset:2px;}
  .steps-nav button{
    background:none;border:none;display:flex;align-items:center;gap:8px;padding:6px 14px;
    font-size:13px;color:var(--ink-soft);font-weight:500;border-radius:5px;
  }
  .steps-nav button:disabled{cursor:default;}
  .steps-nav button.reachable:hover{background:var(--bg);}
  .step-num{
    width:19px;height:19px;border-radius:50%;background:var(--line);color:var(--ink-soft);
    display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:700;flex-shrink:0;
  }
  .step-num.done{background:var(--teal);color:#fff;}
  .step-num.active{background:var(--navy);color:#fff;}
  .steps-nav .step-label.active{color:var(--navy);font-weight:700;}
  .steps-nav .divider{width:22px;height:1px;background:var(--line-strong);}

  main{flex:1;display:flex;flex-direction:column;}

  /* ---------- Buttons ---------- */
  .btn-primary{
    background:var(--navy);color:#fff;border:none;border-radius:6px;
    padding:13px 26px;font-size:14.5px;font-weight:600;display:inline-flex;align-items:center;gap:8px;
    transition:background .15s;text-decoration:none;cursor:pointer;
  }
  .btn-primary:hover{background:var(--blue-dark);}
  .btn-primary:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible{
    outline:3px solid var(--blue); outline-offset:2px;
  }
  .btn-secondary{
    background:#fff;color:var(--navy);border:1.5px solid var(--line-strong);border-radius:6px;
    padding:11px 20px;font-size:14px;font-weight:600;
  }
  .btn-secondary:hover{border-color:var(--navy);background:var(--bg);}
  .btn-text{background:none;border:none;color:var(--blue-dark);font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;}
  .btn-text:hover{text-decoration:underline;}

  /* ---------- Welcome / hero ---------- */
  .hero{
    background:linear-gradient(180deg,var(--champagne-light) 0%, var(--champagne) 100%);
    color:var(--navy);padding:22px 32px 18px;position:relative;overflow:hidden;
  }
  .hero::before{
    content:"";position:absolute;inset:0;
    background-image:
      linear-gradient(rgba(19,34,61,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(19,34,61,0.05) 1px, transparent 1px);
    background-size:56px 56px;
    mask-image:linear-gradient(180deg, rgba(0,0,0,0.5), transparent 80%);
  }
  .hero-inner{max-width:680px;margin:0 auto;text-align:center;position:relative;z-index:1;}
  .hero h1{
    font-size:clamp(38px,7vw,64px);line-height:1.08;color:var(--navy);
    max-width:600px;margin:0 auto;letter-spacing:-0.01em;
  }
  .hero h1 em{
    font-style:italic;font-weight:600;color:var(--champagne-deep);
    -webkit-text-stroke:0.5px var(--navy);
  }
  .hero-subtitle{
    font-size:clamp(14px,1.8vw,17px);color:var(--champagne-text);
    margin:10px auto 0;max-width:440px;line-height:1.5;font-weight:500;
  }
  .hero .btn-primary{background:var(--navy);color:#fff;margin-top:16px;padding:9px 20px;font-size:13.5px;}
  .hero .btn-primary:hover{background:var(--blue-dark);}

  .feature-strip{
    max-width:var(--container);margin:0 auto;padding:0 32px;
    display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
    margin-top:-1px;
  }
  @media (max-width:720px){.feature-strip{grid-template-columns:1fr;}}
  .feature-item{background:var(--surface);padding:26px 28px;display:flex;gap:14px;align-items:flex-start;}
  .feature-item .fi-icon{
    width:34px;height:34px;border-radius:6px;background:var(--teal-bg);color:var(--teal);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
  }
  .feature-item .fi-icon svg{width:17px;height:17px;}
  .feature-item h4{font-family:'Inter',sans-serif;font-size:13.5px;font-weight:700;color:var(--navy);margin:0 0 4px;}
  .feature-item p{font-size:12.5px;color:var(--ink-soft);margin:0;line-height:1.45;}

  /* ---------- Quick picks ---------- */
  .quickpick-section{margin:0 0 32px;text-align:left;}
  .quickpick-heading{font-size:13.5px;font-weight:700;color:var(--navy);margin:0 0 14px;}
  .quickpick-row{display:flex;flex-wrap:wrap;justify-content:flex-start;gap:10px;}
  .quickpick-btn{
    display:flex;align-items:center;gap:8px;background:var(--qp-bg);color:var(--qp-color);
    border:none;border-radius:999px;padding:10px 18px 10px 14px;font-size:13.5px;font-weight:600;
    transition:transform .12s, box-shadow .12s;
  }
  .quickpick-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);}
  .quickpick-btn .qp-icon{width:18px;height:18px;flex-shrink:0;display:flex;}
  .quickpick-btn .qp-icon svg{width:100%;height:100%;}

  /* ---------- Campus illustration (lives inside the dark hero) ---------- */
  .campus-illustration{width:100%;max-width:400px;margin:8px auto 0;}
  .campus-illustration svg{width:100%;height:auto;display:block;}
  .campus-caption{text-align:center;color:var(--champagne-text);font-size:11.5px;margin-top:4px;}

  /* ---------- Generic page shell ---------- */
  .page{max-width:680px;margin:0 auto;padding:56px 32px 90px;width:100%;}
  .page-wide{max-width:var(--container);}
  .page-head{margin-bottom:34px;border-bottom:1px solid var(--line);padding-bottom:26px;}
  .page-head .eyebrow{display:block;margin-bottom:9px;}
  .page-head h2{font-size:27px;}
  .page-head p{color:var(--ink-soft);margin-top:10px;font-size:14.5px;line-height:1.55;max-width:520px;}
  .profile-summary{
    display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:12px;
    font-size:12.5px;font-weight:600;color:var(--navy);
  }
  .profile-summary span[aria-hidden]{color:var(--line-strong);font-weight:400;}
  .profile-summary .btn-text{font-size:12.5px;margin-left:4px;}

  /* ---------- Profile form ---------- */
  .form-card{background:#EAF7EC;border:1px solid #CDEBD1;border-radius:var(--radius);padding:36px;box-shadow:var(--shadow-sm);position:relative;overflow:hidden;}
  .form-card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:4px;
    background:linear-gradient(90deg,var(--teal),var(--blue),var(--amber),var(--plum));
  }
  .form-progress{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;}
  .form-progress-dots{display:flex;gap:6px;}
  .progress-dot{width:9px;height:9px;border-radius:50%;background:var(--line-strong);transition:background .25s, transform .25s;}
  .progress-dot.filled{background:var(--teal);transform:scale(1.15);}
  .form-progress-label{font-size:12px;color:var(--ink-soft);font-weight:600;}
  .field{margin-bottom:22px;}
  .field label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--navy);margin-bottom:7px;}
  .field label svg{width:15px;height:15px;color:var(--ink-soft);flex-shrink:0;}
  .field .hint{font-weight:400;color:var(--ink-soft);font-size:12.5px;margin-left:2px;}
  .field input, .field select{
    width:100%;padding:12px 14px;border:1.5px solid var(--line-strong);border-radius:6px;
    font-size:14.5px;font-family:'Inter',sans-serif;background:#fff;color:var(--ink);
    transition:border-color .15s, box-shadow .15s;
  }
  .field input:focus, .field select:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px rgba(42,92,138,0.12);}
  .field input::placeholder{color:#9AA5B3;}
  .field input.field-error, .field select.field-error{border-color:var(--rose);background:#FDF4F4;}
  .field-error-msg{display:none;color:var(--rose);font-size:12.5px;font-weight:600;margin-top:6px;}
  .field-error-msg.show{display:block;}
  .form-actions{display:flex;justify-content:space-between;align-items:center;margin-top:32px;padding-top:26px;border-top:1px solid var(--line);}

  .school-preview{
    display:none;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;
    background:var(--bg);border-radius:8px;opacity:0;transform:translateY(-4px);
    transition:opacity .25s, transform .25s;
  }
  .school-preview.show{display:flex;opacity:1;transform:translateY(0);}
  .school-preview-icon{width:34px;height:34px;flex-shrink:0;}
  .school-preview-name{font-size:13.5px;font-weight:700;color:var(--navy);}
  .school-preview-status{font-size:11.5px;color:var(--ink-soft);font-weight:600;display:flex;align-items:center;gap:4px;margin-top:2px;}
  .school-preview-status.verified{color:var(--teal);}
  .school-preview-status svg{width:12px;height:12px;flex-shrink:0;}

  /* ---------- Needs / category cards ---------- */
  .category-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  @media (max-width:560px){.category-grid{grid-template-columns:1fr;}}
  .cat-card{
    text-align:left;background:var(--cat-color-bg,var(--surface));border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;display:flex;flex-direction:column;gap:10px;transition:.15s;
    border-top:3px solid var(--cat-color,var(--blue));
  }
  .cat-card:hover{border-color:var(--line-strong);border-top-color:var(--cat-color,var(--blue));box-shadow:var(--shadow-md);}
  .cat-icon{width:36px;height:36px;border-radius:6px;display:flex;align-items:center;justify-content:center;}
  .cat-icon svg{width:18px;height:18px;}
  .cat-card h3{font-size:16.5px;}
  .cat-card p{font-size:13px;color:var(--ink-soft);margin:0;line-height:1.5;}
  .cat-count{font-size:11.5px;color:var(--ink-soft);font-weight:600;letter-spacing:0.02em;}
  .coverage-tag{
    display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:4px;
    width:fit-content;
  }
  .coverage-tag.verified{color:var(--teal);background:var(--teal-bg);}
  .coverage-tag.general{color:var(--ink-soft);background:var(--bg);}
  .coverage-tag.citywide{color:var(--plum);background:var(--plum-bg);}

  /* ---------- Results page ---------- */
  .toolbar{display:flex;gap:10px;margin-bottom:22px;flex-wrap:wrap;}
  .search-box{
    flex:1;min-width:200px;display:flex;align-items:center;gap:9px;
    background:#fff;border:1.5px solid var(--line-strong);border-radius:6px;padding:10px 14px;
  }
  .search-box svg{width:16px;height:16px;color:var(--ink-soft);flex-shrink:0;}
  .search-box input{border:none;outline:none;font-size:14px;width:100%;font-family:'Inter',sans-serif;color:var(--ink);background:transparent;}
  .filter-select{
    border:1.5px solid var(--line-strong);border-radius:6px;padding:10px 14px;font-size:13.5px;
    background:#fff;color:var(--navy);font-weight:600;font-family:'Inter',sans-serif;
  }
  .result-count{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px;font-weight:500;}
  .result-list{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .result-card{
    background:#fff;border:none;
    padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px;
    text-align:left;width:100%;
  }
  .result-card:hover{background:var(--bg);}
  .result-main h3{font-size:16px;margin-bottom:5px;}
  .result-main p{font-size:13px;color:var(--ink-soft);margin:0;line-height:1.4;}
  .result-tag{
    font-size:10.5px;letter-spacing:0.04em;text-transform:uppercase;font-weight:700;
    color:var(--tag-color);background:var(--tag-bg);padding:3px 9px;border-radius:4px;display:inline-block;margin-bottom:8px;
  }
  .result-arrow{flex-shrink:0;color:var(--ink-soft);width:18px;height:18px;}
  .school-badge{
    display:inline-block;margin-left:8px;font-size:10.5px;font-weight:600;color:var(--ink-soft);
    background:var(--bg);border:1px solid var(--line);padding:2px 8px;border-radius:4px;vertical-align:middle;
  }
  .school-badge.verified{color:var(--teal);background:var(--teal-bg);border-color:transparent;}
  .school-badge.citywide{color:var(--plum);background:var(--plum-bg);border-color:transparent;font-style:italic;}
  .notice-banner{
    background:var(--amber-bg);border:1px solid #EAD6A8;color:#5C4109;border-radius:var(--radius);
    padding:14px 18px;font-size:13px;line-height:1.55;margin-bottom:18px;
  }
  .notice-banner em{font-style:normal;font-weight:700;}
  .crisis-banner{
    background:var(--rose-bg);border:1.5px solid #E3B3AC;color:#6B2222;border-radius:var(--radius);
    padding:16px 20px;font-size:14px;line-height:1.6;margin-bottom:20px;display:flex;align-items:center;gap:12px;
  }
  .crisis-banner svg{width:22px;height:22px;flex-shrink:0;color:var(--rose);}
  .crisis-banner a{color:var(--rose);font-weight:700;text-decoration:underline;}
  .footer-crisis{
    background:var(--rose-bg);color:#6B2222;text-align:center;font-size:12.5px;padding:10px 20px;
  }
  .footer-crisis a{color:var(--rose);font-weight:700;text-decoration:underline;}
  .empty-state{
    text-align:center;padding:50px 20px;color:var(--ink-soft);border:1.5px dashed var(--line-strong);border-radius:var(--radius);background:var(--surface);
  }
  .empty-state h3{font-size:16.5px;margin-bottom:8px;}
  .empty-state p{font-size:13.5px;margin:0;}

  /* ---------- Detail page ---------- */
  .detail-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:38px;box-shadow:var(--shadow-sm);}
  .detail-tag{margin-bottom:14px;}
  .detail-card h2{font-size:25px;margin-bottom:6px;}
  .detail-offers{font-size:14.5px;color:var(--ink-soft);line-height:1.6;margin:14px 0 28px;padding-bottom:26px;border-bottom:1px solid var(--line);}
  .detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 30px;}
  @media (max-width:560px){.detail-grid{grid-template-columns:1fr;}}
  .detail-item .eyebrow{display:block;margin-bottom:6px;color:var(--ink-soft);font-weight:700;}
  .detail-item p, .detail-item a{font-size:14px;color:var(--ink);line-height:1.55;margin:0;}
  .detail-item a{color:var(--blue-dark);font-weight:600;text-decoration:none;}
  .detail-item a:hover{text-decoration:underline;}
  .detail-lang-note{
    background:var(--bg);border-radius:8px;padding:12px 14px;font-size:12.5px;
    color:var(--ink-soft);line-height:1.5;margin-top:24px;font-style:italic;
  }
  .detail-footer{margin-top:32px;display:flex;gap:12px;flex-wrap:wrap;padding-top:26px;border-top:1px solid var(--line);}

  .back-row{margin-bottom:22px;}

  /* ---------- Footer ---------- */
  footer.app-footer{background:var(--navy-deep);color:#B7C4DA;margin-top:auto;}
  .footer-inner{max-width:var(--container);margin:0 auto;padding:36px 32px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;}
  .footer-inner .brand-name{color:#fff;font-size:14.5px;}
  .footer-inner .brand-sub{color:#7E8FA9;}
  footer.app-footer .fine-print{font-size:12px;color:#7E8FA9;}
</style>
</head>
<body>
<div id="app"></div>

<script>

*/

  {

/* Each returns white-filled SVG markup (plus school-color "cut-in" details)
   normalized to a 32x32 box centered on origin (-16..16). Caller wraps in
   a <g transform="translate(cx,cy) scale(s)">. */
function schoolIconGlyph(type, color, letters){
  switch(type){
    case "building1": // flat-roof block with square windows (Hunter-style)
      return `
        <rect x="-13" y="-11" width="26" height="22" fill="#fff"/>
        <rect x="-13" y="-14" width="26" height="4" fill="#fff"/>
        <rect x="-9" y="-6" width="4" height="4" fill="${color}"/>
        <rect x="-2" y="-6" width="4" height="4" fill="${color}"/>
        <rect x="5" y="-6" width="4" height="4" fill="${color}"/>
        <rect x="-9" y="1" width="4" height="4" fill="${color}"/>
        <rect x="-2" y="1" width="4" height="4" fill="${color}"/>
        <rect x="5" y="1" width="4" height="4" fill="${color}"/>
        <rect x="-3" y="7" width="6" height="4" fill="${color}"/>`;
    case "building2": // temple-front with pediment and columns (Queens-style)
      return `
        <path d="M-14 -6 L0 -15 L14 -6 Z" fill="#fff"/>
        <rect x="-13" y="-6" width="26" height="20" fill="#fff"/>
        <rect x="-10" y="-3" width="3" height="14" fill="${color}"/>
        <rect x="-4.5" y="-3" width="3" height="14" fill="${color}"/>
        <rect x="1" y="-3" width="3" height="14" fill="${color}"/>
        <rect x="6.5" y="-3" width="3" height="14" fill="${color}"/>`;
    case "building3": // clock-tower building with arched windows (Brooklyn-style)
      return `
        <rect x="-13" y="-4" width="26" height="18" fill="#fff"/>
        <path d="M-2 -15 h4 v4 h5 l-7 8 l-7 -8 h5 Z" fill="#fff"/>
        <circle cx="0" cy="-8" r="2.6" fill="${color}"/>
        <path d="M-9 0 a3 3 0 0 1 6 0 v6 h-6 Z" fill="${color}"/>
        <path d="M-3 0 a3 3 0 0 1 6 0 v6 h-6 Z" fill="${color}"/>
        <path d="M3 0 a3 3 0 0 1 6 0 v6 h-6 Z" fill="${color}"/>`;
    case "tower": // gothic tower with crenellations (CCNY-style)
      return `
        <path d="M-9 -15 h3 v3 h3 v-3 h3 v3 h3 v-3 h3 v5 h-15 Z" fill="#fff"/>
        <rect x="-9" y="-10" width="18" height="24" fill="#fff"/>
        <path d="M-3 -2 a3 3 0 0 1 6 0 v12 h-6 Z" fill="${color}"/>`;
    case "sun": // radiating sunburst (BMCC-style)
      return Array.from({length:8}).map((_,i)=>{
        const ang = (i*45)*Math.PI/180;
        const x1 = Math.cos(ang)*7, y1 = Math.sin(ang)*7;
        const x2 = Math.cos(ang)*15, y2 = Math.sin(ang)*15;
        return `<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="#fff" stroke-width="3.4" stroke-linecap="round"/>`;
      }).join("") + `<circle cx="0" cy="0" r="6.5" fill="#fff"/>`;
    case "star": // six-point star flourish (LaGuardia-style)
      return Array.from({length:6}).map((_,i)=>{
        const ang = (i*60)*Math.PI/180;
        const tipX = Math.cos(ang)*15, tipY = Math.sin(ang)*15;
        const a1 = ang - 0.32, a2 = ang + 0.32;
        const bx1 = Math.cos(a1)*5.5, by1 = Math.sin(a1)*5.5;
        const bx2 = Math.cos(a2)*5.5, by2 = Math.sin(a2)*5.5;
        return `<path d="M${bx1.toFixed(1)} ${by1.toFixed(1)} L${tipX.toFixed(1)} ${tipY.toFixed(1)} L${bx2.toFixed(1)} ${by2.toFixed(1)} Z" fill="#fff"/>`;
      }).join("") + `<circle cx="0" cy="0" r="5" fill="#fff"/>`;
    case "shield": // shield outline with a colored monogram
      return `
        <path d="M0 -15 L13 -10 V2 C13 10 7 15 0 17 C-7 15 -13 10 -13 2 V-10 Z" fill="#fff"/>
        <text x="0" y="1.5" text-anchor="middle" dominant-baseline="central" font-family="Inter, sans-serif" font-weight="800" font-size="${letters.length>1?12:15}" fill="${color}">${letters}</text>`;
    case "cap": // generic graduation cap (fallback for schools without a researched brand color yet)
      return `
        <path d="M0 -10 L16 -3 L0 4 L-16 -3 Z" fill="#fff"/>
        <path d="M-8 0 v6 c0 3 4 5 8 5 s8 -2 8 -5 v-6" fill="none" stroke="#fff" stroke-width="2.4"/>
        <line x1="16" y1="-3" x2="16" y2="7" stroke="#fff" stroke-width="2"/>
        <circle cx="16" cy="9" r="2" fill="#fff"/>`;
    default:
      return `<circle cx="0" cy="0" r="15" fill="#fff"/>`;
  }
}

function buildHeroIllustration(){
  const badgeMarkup = CAMPUS_BADGES.map(b=>{
    const cx = b.x + b.w/2, cy = b.y + b.h/2;
    const iconR = b.h/2 - 4;
    const iconCx = b.x + b.h/2;
    const textX = b.x + b.h + 6;
    const iconScale = iconR / 16;

/* Translation lookup with {placeholder} interpolation and English fallback
   for any key that (should never happen, but) is missing in a language. */
function t(key, vars){
  const dict = I18N[state.lang] || I18N.en;
  let str = dict[key] !== undefined ? dict[key] : (I18N.en[key] !== undefined ? I18N.en[key] : key);
  if(vars){
    Object.keys(vars).forEach(k=>{
      str = str.split("{"+k+"}").join(vars[k]);
    });
  }
  return str;
}

function setLang(code){
  state.lang = code;
  const meta = LANG_META[code] || LANG_META.en;
  document.documentElement.setAttribute("dir", meta.dir);
  document.documentElement.setAttribute("lang", code);
  document.body.style.fontFamily = meta.font;
  render();
}

/* ============ Renderers ============ */
function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  app.appendChild(renderShell());
}

function renderShell(){
  const wrap = document.createElement("div");
  wrap.style.display = "flex";
  wrap.style.flexDirection = "column";
  wrap.style.minHeight = "100vh";
  wrap.appendChild(renderTopbar());
  wrap.appendChild(renderHeader());

  const main = document.createElement("main");
  const pageMap = { welcome: renderWelcome, profile: renderProfile, needs: renderNeeds, results: renderResults, detail: renderDetail };
  main.appendChild(pageMap[state.page]());
  wrap.appendChild(main);
  wrap.appendChild(renderFooter());
  return wrap;
}

function renderTopbar(){
  const bar = document.createElement("div");
  bar.className = "topbar";
  bar.innerHTML = `<div class="topbar-inner"><span>${t("top_directory")}</span><span>${t("top_free")}</span></div>`;
  return bar;
}

function renderHeader(){
  const header = document.createElement("div");
  header.className = "app-header";

  const inner = document.createElement("div");
  inner.className = "header-inner";

  const brand = document.createElement("button");
  brand.style.cssText = "background:none;border:none;display:flex;align-items:center;gap:12px;padding:0;";
  brand.className = "brand";
  brand.innerHTML = `<div class="brand-mark">JS</div><div class="brand-text"><span class="brand-name">The Journey to Success</span><span class="brand-sub">${t("brand_sub")}</span></div>`;
  brand.addEventListener("click", ()=>go("welcome"));
  inner.appendChild(brand);

  const rightGroup = document.createElement("div");
  rightGroup.className = "header-right-group";

  if(state.page !== "welcome"){
    const nav = document.createElement("div");
    nav.className = "steps-nav";
    const labels = [t("step_profile"), t("step_needs"), t("step_resources")];
    const targets = ["profile","needs","results"];
    const idx = stageIndex(state.page); // 1,2,3 correspond to profile/needs/results
    labels.forEach((label,i)=>{
      const stepIdx = i+1;
      if(i>0){
        const div = document.createElement("div");
        div.className = "divider";
        nav.appendChild(div);
      }
      const btn = document.createElement("button");
      // Profile is always reachable. Support needs and Resources become
      // reachable as soon as a school is on file — not only after the
      // student has physically clicked through them in order — so
      // "Resources" can jump straight to every resource at their school.
      const reachable = stepIdx === 1 || !!state.profile.school;
      btn.className = "reachable";
      btn.disabled = !reachable;
      const numClass = stepIdx < idx ? "done" : (stepIdx === idx ? "active" : "");
      btn.innerHTML = `<span class="step-num ${numClass}">${stepIdx < idx ? "&#10003;" : stepIdx}</span><span class="step-label ${stepIdx===idx?'active':''}">${label}</span>`;
      if(reachable){
        btn.addEventListener("click", ()=>{
          if(stepIdx === 3 && idx < 3){
            // Jumping to Resources without having picked a category yet —
            // show every resource for their school instead of nothing.
            go("results", { filterCategory: "All", search: "" });
          } else {
            go(targets[i]);
          }
        });
      }
      nav.appendChild(btn);
    });
    rightGroup.appendChild(nav);
  }

  const langSelect = document.createElement("select");
  langSelect.className = "lang-select";
  langSelect.setAttribute("aria-label", "Language");
  Object.keys(LANG_META).forEach(code=>{
    const opt = document.createElement("option");
    opt.value = code;
    opt.textContent = LANG_META[code].name;
    if(code === state.lang) opt.selected = true;
    langSelect.appendChild(opt);
  });
  langSelect.addEventListener("change", (e)=> setLang(e.target.value));
  rightGroup.appendChild(langSelect);

  inner.appendChild(rightGroup);
  header.appendChild(inner);
  return header;
}

function renderProfile(){
  const el = document.createElement("div");

  const filledCount = ["school","major","year"].filter(k => state.profile[k]).length;
  const yearKeys = ["year1","year2","year3","year4","year5","year6"];
  el.innerHTML = `

      <span class="eyebrow">${t("profile_step")}</span>
      <h2>${t("profile_title")}</h2>
      <p>${t("profile_intro")}</p>

          <span class="progress-dot" id="dotSchool"></span>
          <span class="progress-dot" id="dotMajor"></span>
          <span class="progress-dot" id="dotYear"></span>
        </div>
        <span class="form-progress-label" id="progressLabel">${t("progress_filled",{n:filledCount})}</span>
      </div>
      <form id="profileForm" novalidate>
        <div class="field">
          <label for="school">${ICONS.building} ${t("label_school")}</label>
          <select id="school">
            <option value="" ${state.profile.school===""?"selected":""}>${t("placeholder_select_school")}</option>
            ${SCHOOLS.map(s=>`<option value="${s}" ${state.profile.school===s?"selected":""}>${s}</option>`).join("")}
          </select>
          <div class="field-error-msg" id="schoolError">${t("error_select_school")}</div>
          <div class="school-preview" id="schoolPreview"></div>
        </div>
        <div class="field">
          <label for="major">${ICONS.book} ${t("label_major")} <span class="hint">${t("optional")}</span></label>
          <input id="major" type="text" placeholder="${t("placeholder_major")}" value="${escapeHtml(state.profile.major)}">
        </div>
        <div class="field">
          <label for="year">${ICONS.calendar} ${t("label_year")} <span class="hint">${t("optional")}</span></label>
          <select id="year">
            <option value="" ${state.profile.year===""?"selected":""}>${t("placeholder_select_year")}</option>
            ${["First year","Second year","Third year","Fourth year","Fifth year+","Graduate student"].map((y,i)=>
              `<option value="${y}" ${state.profile.year===y?"selected":""}>${t(yearKeys[i])}</option>`).join("")}
          </select>
        </div>
        <div class="form-actions">
          <button type="button" class="btn-text" id="skipBtn">${ICONS.back} ${t("btn_back")}</button>
          <button type="button" class="btn-primary" id="continueBtn">${t("btn_continue")} ${ICONS.arrowRight}</button>
        </div>
      </form>
    </div>
  `;
  el.querySelector("#skipBtn").addEventListener("click", ()=>go("welcome"));

  const schoolInput = el.querySelector("#school");
  const majorInput = el.querySelector("#major");
  const yearInput = el.querySelector("#year");
  const dotSchool = el.querySelector("#dotSchool");
  const dotMajor = el.querySelector("#dotMajor");
  const dotYear = el.querySelector("#dotYear");
  const progressLabel = el.querySelector("#progressLabel");
  const schoolPreview = el.querySelector("#schoolPreview");

  function updateProgress(){
    const filled = [schoolInput.value, majorInput.value, yearInput.value].filter(v => v.trim() !== "").length;
    dotSchool.classList.toggle("filled", schoolInput.value.trim() !== "");
    dotMajor.classList.toggle("filled", majorInput.value.trim() !== "");
    dotYear.classList.toggle("filled", yearInput.value.trim() !== "");
    progressLabel.textContent = filled === 3 ? t("progress_all_set") : t("progress_filled",{n:filled});
  }

  function updateSchoolPreview(){
    const school = schoolInput.value;
    if(!school || school === "My school isn't listed"){
      schoolPreview.classList.remove("show");
      schoolPreview.innerHTML = "";
      return;
    }
    const v = schoolVisual(school);
    const verifiedCount = CATEGORIES.filter(c => c.key !== "Free Courses" && schoolHasVerifiedCategory(school, c.key)).length;
    const statusText = verifiedCount > 0
      ? `${ICONS.checkCircle} ${t("preview_verified",{n:verifiedCount})}`
      : t("preview_general");
    schoolPreview.innerHTML = `
      <svg viewBox="-16 -16 32 32" class="school-preview-icon"><circle cx="0" cy="0" r="15" fill="${v.color}"/>${schoolIconGlyph(v.icon, v.color, v.mono)}</svg>
      <div class="school-preview-text">
        <div class="school-preview-name">${escapeHtml(school)}</div>
        <div class="school-preview-status ${verifiedCount>0?'verified':''}">${statusText}</div>
      </div>`;
    schoolPreview.classList.add("show");
  }

  schoolInput.addEventListener("change", ()=>{ updateSchoolPreview(); updateProgress(); });
  majorInput.addEventListener("input", updateProgress);
  yearInput.addEventListener("change", updateProgress);
  updateSchoolPreview();
  updateProgress();

  function submitProfile(){
    const school = schoolInput.value.trim();
    const major = majorInput.value.trim();
    const year = yearInput.value;

    const isValid = school !== "";
    schoolInput.classList.toggle("field-error", !isValid);
    el.querySelector("#schoolError").classList.toggle("show", !isValid);
    if(!isValid){
      schoolInput.focus();
      return;
    }

    state.profile.school = school;
    state.profile.major = major;
    state.profile.year = year;

    if(state.pendingIntent){
      const intent = state.pendingIntent;
      state.pendingIntent = null;
      go("results", { selectedCategory: intent.category, filterCategory: intent.category, search: intent.search });
    } else {
      go("needs");
    }
  }

  // Bind directly to the button click (not form "submit") and also support
  // pressing Enter in a text field, so this works regardless of how the
  // page is embedded.
  el.querySelector("#continueBtn").addEventListener("click", submitProfile);
  el.querySelector("#profileForm").addEventListener("keydown", (e)=>{
    if(e.key === "Enter" && e.target.tagName !== "SELECT"){
      e.preventDefault();
      submitProfile();
    }
  });
  return el;
}

  return RESOURCES.some(r => r.school === school && r.category === categoryKey);
}

  const school = state.profile.school;
  el.innerHTML = `

    <div class="category-grid" id="catGrid"></div>
  `;
  el.querySelector("#backBtn").addEventListener("click", ()=>go("profile"));

  const qpRow = el.querySelector("#quickpickRow");
  QUICK_PICKS.forEach(qp=>{
    const cat = CATEGORIES.find(c => c.key === qp.category);
    const btn = document.createElement("button");
    btn.className = "quickpick-btn";
    btn.style.setProperty("--qp-color", cat.color);

    btn.innerHTML = `<span class="qp-icon">${cat.icon}</span><span>${qp.emoji||""}${t(qp.labelKey)}</span>`;
    btn.addEventListener("click", ()=>{
      go("results", { selectedCategory: qp.category, filterCategory: qp.category, search: qp.search });
    });
    qpRow.appendChild(btn);
  });

  const grid = el.querySelector("#catGrid");
  CATEGORIES.forEach(cat=>{
    const count = RESOURCES.filter(r=>r.category===cat.key).length;
    const card = document.createElement("button");
    card.className = "cat-card";
    card.style.setProperty("--cat-color", cat.color);
    card.style.setProperty("--cat-color-bg", cat.bg);
    let coverageTag = "";
    if(cat.key === "Free Courses"){
      coverageTag = `<span class="coverage-tag citywide">${t("tag_citywide")}</span>`;
    } else if(school){
      coverageTag = schoolHasVerifiedCategory(school, cat.key)
        ? `<span class="coverage-tag verified">&#10003; ${t("tag_verified")}</span>`
        : `<span class="coverage-tag general">${t("tag_general")}</span>`;
    }
    card.innerHTML = `
      <div class="cat-icon" style="background:#fff;color:${cat.color}">${cat.icon}</div>
      <h3>${t(cat.nameKey)}</h3>
      <p>${t(cat.descKey)}</p>
      ${coverageTag}
      <span class="cat-count">${count} ${t(count!==1?"resource_other":"resource_one")}</span>
    `;
    card.addEventListener("click", ()=>{
      let prefillSearch = "";
      if(cat.key === "Tutoring" && state.profile.major && state.profile.major.toLowerCase() !== "undecided"){
        const q = state.profile.major.trim().toLowerCase();
        const wouldMatch = getResourcePool().some(r =>
          r.category === "Tutoring" &&
          (r.name.toLowerCase().includes(q) || r.offers.toLowerCase().includes(q) || r.location.toLowerCase().includes(q))
        );
        // Only pre-fill if the major actually matches something here — a
        // narrow subject that doesn't match this school's tutoring center
        // names should never make results look empty.
        if(wouldMatch) prefillSearch = state.profile.major;
      }
      go("results", { selectedCategory: cat.key, filterCategory: cat.key, search: prefillSearch });
    });
    grid.appendChild(card);
  });
  return el;
}

function getResourcePool(){
  const school = state.profile.school;
  const bySchool = RESOURCES.filter(r => r.school === school);
  const schoolHasCategory = new Set(bySchool.map(r => r.category));
  const fallback = RESOURCES.filter(r => r.school === "General" && !schoolHasCategory.has(r.category));
  const cityWide = RESOURCES.filter(r => r.school === "All");
  return [...bySchool, ...fallback, ...cityWide];
}

function getFilteredResources(){
  const q = state.search.trim().toLowerCase();
  return getResourcePool().filter(r=>{
    const matchesCategory = state.filterCategory === "All" || r.category === state.filterCategory;
    const matchesSearch = !q || r.name.toLowerCase().includes(q) || r.offers.toLowerCase().includes(q) || r.category.toLowerCase().includes(q) || r.location.toLowerCase().includes(q);
    return matchesCategory && matchesSearch;
  });
}

function renderResultsBody(container){
  const results = getFilteredResources();
  container.innerHTML = "";

  if(state.filterCategory === "Mental Health Support" || state.filterCategory === "All"){
    const crisis = document.createElement("div");
    crisis.className = "crisis-banner";
    crisis.innerHTML = `${ICONS.shield}<span>${t("crisis_text").replace("988", '<a href="tel:988">988</a>')}</span>`;
    container.appendChild(crisis);
  }

  const school = state.profile.school;
  const showingFallback = school && results.some(r => r.school === "General");
  if(showingFallback){
    const banner = document.createElement("div");
    banner.className = "notice-banner";
    const catObj = CATEGORIES.find(c => c.key === state.filterCategory);
    const categoryPhrase = (state.filterCategory === "All" || state.filterCategory === "Free Courses")
      ? t("notice_this_category")
      : `<strong>${escapeHtml(catObj ? t(catObj.nameKey) : state.filterCategory)}</strong>`;
    const isPlural = results.filter(r=>r.school==="General").length !== 1;
    banner.innerHTML = t(isPlural ? "notice_text_other" : "notice_text_one", {
      cat: categoryPhrase,
      school: `<strong>${escapeHtml(school)}</strong>`
    });
    container.appendChild(banner);
  }

  const countEl = document.createElement("div");
  countEl.className = "result-count";
  countEl.textContent = t(results.length!==1?"found_text_other":"found_text_one", {n: results.length});
  container.appendChild(countEl);

  if(results.length === 0){
    const empty = document.createElement("div");
    empty.className = "empty-state";
    empty.innerHTML = `<h3>${t("empty_title")}</h3><p>${t("empty_desc")}</p>`;
    container.appendChild(empty);
    return;
  }

  const list = document.createElement("div");
  list.className = "result-list";
  results.forEach(r=>{
    const cat = CATEGORIES.find(c=>c.key===r.category);
    const card = document.createElement("button");
    card.className = "result-card";
    card.innerHTML = `
      <div class="result-main">
        <span class="result-tag" style="--tag-color:${cat.color};--tag-bg:${cat.bg}">${t(cat.nameKey)}</span>
        ${schoolBadge(r)}
        <h3>${r.name}</h3>
        <p>${r.offers}</p>
      </div>
      ${ICONS.arrowRight.replace("<svg ", '<svg class="result-arrow" ')}
    `;
    card.addEventListener("click", ()=>go("detail", { selectedResourceId: r.id }));
    list.appendChild(card);
  });
  container.appendChild(list);
}

        <div class="detail-item">
          <span class="eyebrow">${t("detail_location")}</span>
          <p>${ICONS.mapPin.replace("<svg ", '<svg style="width:14px;height:14px;vertical-align:-2px;margin-right:4px;color:'+cat.color+'" ')}${r.location}</p>
        </div>
        <div class="detail-item">
          <span class="eyebrow">${t("detail_website")}</span>
          <p><a href="${r.website}" target="_blank" rel="noopener" onclick="return openResourceLink(this.href)">${r.website.replace("https://www.","")}</a></p>
        </div>
      </div>
      ${state.lang !== "en" ? `<p class="detail-lang-note">${t("detail_lang_note")}</p>` : ""}
      <div class="detail-footer">
        ${r.appointmentLink ? `<a href="${r.appointmentLink}" target="_blank" rel="noopener" onclick="return openResourceLink(this.href)" class="btn-primary">${ICONS.calendar} ${t("btn_appointment")}</a>` : ""}
        <button class="btn-secondary" id="allBtn">${t("btn_see_all")}</button>
      </div>
    </div>
  `;
  el.querySelector("#backBtn").addEventListener("click", ()=>go("results"));
  el.querySelector("#allBtn").addEventListener("click", ()=>go("results", { filterCategory:"All", search:"" }));
  return el;
}

/* ============ Utils ============ */
function schoolBadge(r){
  if(r.school === "All") return `<span class="school-badge citywide">${t("badge_citywide_full")}</span>`;
  const verified = SCHOOLS_WITH_DATA.has(r.school);
  const label = r.school === "General" ? t("tag_general") : r.school;
  return `<span class="school-badge ${verified ? "verified" : ""}">${verified ? "&#10003; " : ""}${escapeHtml(label)}</span>`;
}
function openResourceLink(url){
  try{
    const win = window.open(url, "_blank", "noopener");
    if(!win){
      // Popup was blocked (common in sandboxed preview contexts) — fall
      // back to navigating the current tab so the link still works.
      window.location.href = url;
    }
  } catch(e){
    window.location.href = url;
  }
  return false; // prevent the default anchor navigation either way
}
function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[s]));
}

render();
</script>
</body>
</html>
